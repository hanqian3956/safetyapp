#view-feed .feed-card-footer,
#view-feed .feed-comments { position: relative; z-index: 1; }
#view-feed .feed-attachments { gap: 8px !important; }
#view-feed .feed-attachment { min-height: 40px !important; font-size: 12px !important; border-radius: 10px !important; }

/* ---------- 5. 操作栏：单行等分、44px 触控、克制视觉 ---------- */
#view-feed .feed-card-footer {
  display: flex !important; flex-wrap: nowrap !important; gap: 2px !important;
  margin-top: 10px !important; padding-top: 4px !important;
  border-top: 1px solid var(--line) !important;
}
#view-feed .feed-card-footer .feed-action {
  flex: 1 1 0 !important; min-width: 0; width: auto !important;
  min-height: 44px !important; margin: 0 !important;
  padding: 8px 4px !important; border-radius: 8px !important; border-top: 0 !important;
  justify-content: center !important;
  font-size: 12px !important; color: var(--muted) !important;
}
#view-feed .feed-card-footer .feed-action svg { width: 18px !important; height: 18px !important; }
#view-feed .feed-card-footer .feed-action.relate {
  flex: 2 1 0 !important; justify-content: flex-end !important;
  color: var(--accent) !important;
}
#view-feed .feed-card-footer .feed-action.relate .lbl {
  display: inline !important; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#view-feed .feed-card-footer .feed-action.like.on { color: var(--danger) !important; }

/* ---------- 6. 输入：16px 防 iOS 聚焦缩放 ---------- */
main input[type="text"], main textarea,
.sheet-panel input, .sheet-panel textarea,
.cmt-panel input, .cmt-panel textarea,
.detail-dialog textarea { font-size: 16px !important; }

/* ---------- 7. 底部导航 + 按压反馈（替代 hover 依赖） ---------- */
.bottom-nav { box-shadow: 0 -1px 0 var(--line); }
.nav-item { min-height: 52px; gap: 2px !important; font-size: 11px !important; }
.nav-item.active svg { stroke-width: 2.3; }
#view-feed .feed-post-btn:active, .nav-item:active,
#view-feed .feed-action:active, #view-feed .head-icon:active,
#view-feed .feed-attachment:active, #view-feed .feed-scope-item:active,
.detail-tab:active, .cmt-tab:active, .btn-primary:active, .btn-ghost:active { opacity: .65; }

/* ---------- 8. 底部抽屉 / 详情页：安全区 + 主题 token 化 ---------- */
.cmt-panel, .rec-panel, .sheet-panel { border-radius: 20px 20px 0 0 !important; }
.sheet-foot, .cmt-foot, .post-foot,
.detail-dialog .composer { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; }
#detailHead .detail-back { width: 44px; height: 44px; }
/* 把原覆盖层里写死的浅色改成设计 token，暗色主题下不再出现刺眼白块 */
.detail-dialog,
.detail-dialog .detail-body,
.detail-dialog .detail-tab-body { background: var(--canvas) !important; }
.detail-dialog .detail-head,
.detail-dialog .detail-tabs,
.detail-dialog .composer,
.detail-dialog .comment-item,
.detail-dialog .liker-row,
.detail-card { background: var(--surface) !important; }
.detail-dialog .detail-nav-title,
.detail-dialog .detail-title,
.detail-dialog .detail-back,
.detail-dialog .detail-publisher .dp-name,
.detail-dialog .comment-head b,
.detail-dialog .comment-text,
.detail-relate,
.detail-relate .dr-text b { color: var(--text) !important; }
.detail-dialog .detail-tab,
.detail-dialog .detail-tab .seg,
.detail-dialog .detail-publisher .dp-sub,
.detail-dialog .detail-publisher .dp-sub time,
.detail-dialog .detail-relate .dr-text small,
.detail-quote-text { color: var(--muted) !important; }
.detail-dialog .detail-tab.sel,
.detail-dialog .detail-tab.sel .seg { color: var(--accent) !important; }
.detail-relate { background: var(--surface-soft) !important; }

/* ---------- 9. Toast / 空状态 / 动效降级 ---------- */
.toast {
  left: 16px !important; right: 16px !important;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px)) !important;
  justify-content: center !important; border-radius: 12px !important;
}
#view-feed .empty-side { font-size: 13px !important; padding: 40px 12px !important; }
#view-feed .empty-side svg { width: 40px !important; height: 40px !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ===== 动态详情页 · 评论区改版 =====
   1) 评论白板通栏铺平、去圆角，评论之间用 1px 横线分隔
   2) 评论输入条默认只留输入框；点击/聚焦后在输入框下方横排展开工具按钮 */
.detail-dialog #detailComments { margin: 0 -14px; background: var(--surface); }
.detail-dialog #detailComments .comment-item {
  border-radius: 0; margin-bottom: 0; padding: 12px 14px;
  border-bottom-width: 1px; border-bottom-style: solid; border-bottom-color: var(--line);
}
.detail-dialog #detailComments .comment-item:last-child { border-bottom-width: 0; }

.detail-dialog .composer { flex-direction: column; align-items: stretch; gap: 0; }
.detail-dialog .composer textarea { flex: 0 0 auto; min-height: 24px; padding: 3px 0; }
.detail-dialog .composer #composerPhotos:empty { display: none; }
.detail-dialog .composer-bar { margin-top: 8px; gap: 6px; }
.detail-dialog .composer:not(.is-expanded) .composer-bar { display: none; }

/* 点赞 Tab：与评论 Tab 同款通栏白板 + 横线分隔（id 精确作用域，避免影响评论列表） */
.detail-dialog #detailLikers { margin: 0 -14px; background: var(--surface); }
.detail-dialog #detailLikers .liker-row {
  border-radius: 0; margin-bottom: 0; padding: 12px 14px;
  border-top: 0;
  border-bottom-width: 1px; border-bottom-style: solid; border-bottom-color: var(--line);
}
.detail-dialog #detailLikers .liker-row:last-child { border-bottom-width: 0; }

/* ===== 发动态页：取消 / 发布动态固定在视图最底部 =====
   main 是滚动容器，sticky 只在 .post-wrap 内生效、内容短时页脚会悬空。
   改为整页 flex 列：表单区自己滚动，页脚不滚动、始终贴在视图底部。 */
#view-post[hidden] { display: none; }   /* 作者样式 display:flex 会盖掉 UA 的 [hidden]，必须显式声明 */
#view-post {
  display: flex; flex-direction: column;
  height: 100%; min-height: 0;
}
#view-post > .feed-page-head { flex: 0 0 auto; }
#view-post > .post-wrap {
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column;
}
#view-post .post-pane {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
#view-post .post-foot { flex: 0 0 auto; position: static; }

/* ===== 动态来源动态号标签（恢复） ===== */
.feed-source { border: 0; border-radius: 5px; background: var(--surface-soft); color: var(--muted); font-size: 10px; font-weight: 650; padding: 2px 7px; display: inline-flex; align-items: center; gap: 4px; }
.feed-source svg { width: 11px; }
.feed-source:hover { background: var(--accent-soft); color: var(--accent); }
#view-feed .feed-source { font-size: 11px !important; padding: 3px 8px !important; border-radius: 6px !important; }

/* ===== 动态号详情（恢复：仅详情页作用域，不恢复动态号模块入口） ===== */
#view-nodetail .feed-page-head .section-title { justify-content: flex-start; align-items: center; gap: 8px; min-height: 30px; }
#view-nodetail .feed-page-head .section-title h2 { flex: 1; min-width: 0; font-size: 14.5px; }
#view-nodetail .nodetail-back { flex: 0 0 auto; width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 9px; display: grid; place-items: center; color: var(--text); background: var(--surface); }
#view-nodetail .nodetail-back svg { width: 18px; }
#view-nodetail .nodetail-back:hover { text-decoration: none; border-color: var(--accent); color: var(--accent); }
#view-nodetail .nd-basic { margin-bottom: 14px; padding: 13px 16px; }
#view-nodetail .nd-basic-head { display: flex; align-items: center; gap: 12px; }
#view-nodetail .nd-basic-head .rec-icon { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
#view-nodetail .nd-basic-head .rec-icon svg { width: 19px; }
#view-nodetail .nd-basic-titles { min-width: 0; }
#view-nodetail .nd-basic-titles .nd-basic-meta { margin-top: 6px; }
#view-nodetail .nd-basic-head h3 { margin: 0; font-size: 13px; line-height: 1.25; }
#view-nodetail .nd-basic-aside { margin-left: auto; display: flex; align-items: center; gap: 6px; }
#view-nodetail .nd-basic-head .rec-status { font-size: 10.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
#view-nodetail .nd-basic-toggle { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: transform .18s ease, color .15s, border-color .15s; }
#view-nodetail .nd-basic-toggle svg { width: 16px; }
#view-nodetail .nd-basic--collapsed .nd-basic-toggle { transform: rotate(-90deg); }
#view-nodetail .nd-follow, #view-nodetail .nd-publish { min-height: 0; border-radius: 5px; padding: 2px 6px; border: 1px solid var(--accent); font-size: 10px; font-weight: 600; white-space: nowrap; cursor: pointer; }
#view-nodetail .nd-publish { background: var(--surface); color: var(--accent); }
#view-nodetail .nd-follow { background: var(--accent); color: #fff; }
#view-nodetail .nd-follow.on { border-color: var(--line); background: var(--surface-soft); color: var(--muted); }
#view-nodetail .nd-basic--collapsed .nd-basic-body { display: none; }
#view-nodetail .nd-basic-meta { display: flex; flex-wrap: wrap; gap: 5px 18px; margin-top: 11px; }
#view-nodetail .nd-basic-meta span { display: inline-flex; align-items: baseline; gap: 5px; font-size: 11px; }
#view-nodetail .nd-basic-meta i { color: var(--muted); font-style: normal; }
#view-nodetail .nd-basic-meta b { font-size: 11.5px; font-weight: 600; }
#view-nodetail .nd-basic-desc { margin: 10px 0 0; font-size: 11px; line-height: 1.55; color: var(--muted); }
#view-nodetail .no-detail-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 16px; }
#view-nodetail .no-detail-filter > * { flex: 0 0 auto; }
#view-nodetail .nd-search { flex: 0 0 auto; width: 150px; height: 34px; padding: 0 10px; margin: 0; }
#view-nodetail .no-seg { display: flex; align-items: center; gap: 6px; }
#view-nodetail .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#view-nodetail .seg::-webkit-scrollbar { display: none; }
#view-nodetail .seg button { padding: 4px 8px; font-size: 10.5px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--muted); white-space: nowrap; cursor: pointer; }
#view-nodetail .seg button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
#view-nodetail #ndFeedPanel { margin: 0 -14px; padding: 12px 14px; border: 0; border-radius: 0; box-shadow: none; }
#view-nodetail .rec-feed-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; width: 100%; border: 0; background: transparent; text-align: left; color: inherit; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
#view-nodetail .rec-feed-item:first-child { border-top: 0; }
#view-nodetail .rec-feed-item:hover { background: var(--surface-soft); margin: 0 -9px; padding: 10px 9px; border-radius: 8px; }
#view-nodetail .rec-feed-item .feed-avatar { width: 28px; height: 28px; border-radius: 7px; font-size: 10px; }
#view-nodetail .rec-feed-item b { font-size: 11px; font-weight: 600; display: block; }
#view-nodetail .rec-feed-item small { font-size: 10.5px; color: var(--muted); }

/* ===== 文件 / 工作表预览：整页二级页面（原 sheet 弹窗改为页面） ===== */
#view-file {
  display: flex; flex-direction: column;
  height: 100%; min-height: 0;
}
#view-file[hidden] { display: none; }
#view-file > .feed-page-head { flex: 0 0 auto; }
#view-file > .file-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
#view-file .file-pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#view-file .file-foot { flex: 0 0 auto; position: static; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }

/* 发动态页：页脚零间距、左右通栏贴死手机框底边。
   main 底部内边距有两处覆盖（is-detail 16px、@media≤480px 88px !important），
   故由 switchView 挂 .post-no-pad 并以更高特异性 !important 清零。 */
.page-shell main.post-no-pad { padding-bottom: 0 !important; }
#view-post .post-foot {
  margin: 0 -14px;              /* 抵消 main 左右 14px 内边距，通栏到手机框边 */
  padding-left: 14px; padding-right: 14px;  /* 按钮内容仍与上方表单对齐 */
}

/* ===== 动态详情：评论输入条改为固定底栏（铺平通栏 + 缩小高度 + 贴死底部） =====
   输入条已从 #detailTabBody（滚动区内、左右内缩 14px、sticky）移到
   .detail-dialog 的直接子级 #detailComposerSlot；dialog 是 flex 列，
   detail-body 为 flex:1 滚动区，故 slot 天然全宽且不随内容滚动。 */
.detail-dialog #detailComposerSlot {
  flex: 0 0 auto;
  background: var(--surface);
  border-top-width: 1px; border-top-style: solid; border-top-color: var(--line);
}
.detail-dialog #detailComposerSlot .composer {
  position: static; margin: 0; border: 0; border-radius: 0;
  padding: 5px 14px calc(6px + env(safe-area-inset-bottom, 0px)) !important;
  min-height: 0;
}
.detail-dialog #detailComposerSlot .composer textarea { min-height: 24px; padding: 0; }
.detail-dialog #detailComposerSlot .composer-bar { margin-top: 6px; }
.detail-dialog #detailComposerSlot .composer-btn { width: 26px; height: 26px; min-height: 0; }
.detail-dialog #detailComposerSlot .send-btn { min-height: 26px; padding: 0 12px; font-size: 12px; }

/* ===== 键盘避让 =====
   1) 弹层（详情页 / 抽屉 / 二级页）整体抬高 var(--kb-h)，输入框与底部按钮始终在键盘之上；
   2) 普通页面内的输入框由脚本把焦点元素滚到可视区中部（见文件末尾 keyboardAvoid）。 */
body.kb-open .detail-dialog,
body.kb-open .cmt-panel,
body.kb-open .sheet-panel {
  padding-bottom: var(--kb-h, 0px) !important;
  transition: padding-bottom .18s ease;
}
/* 二级页 / 详情页不预留底部导航高度（这些页面本身不展示导航） */
.workbench.is-detail .page-shell main { padding-bottom: 16px !important; }
/* 键盘弹出时，普通页面额外留出键盘高度的滚动余量，保证末尾输入框也能滚到键盘上方 */
body.kb-open .page-shell main { padding-bottom: calc(24px + var(--kb-h, 0px)) !important; }
/* 模拟键盘弹出时：主内容区缩短，页脚随之上移；底部导航让位给键盘 */
body.kb-open .page-shell main { margin-bottom: var(--kb-h, 0px); }
body.kb-open .bottom-nav { display: none !important; }
/* 键盘弹出时收起发动态页脚的「取消 / 发布动态」，收起键盘后自动恢复 */
body.kb-open #view-post .post-foot { display: none !important; }

/* ===== 楼中楼回复（动态详情 + 评论抽屉共用） =====
   点击某条评论的「回复」后输入条进入回复态，发送的内容挂到该评论 c.replies，
   渲染在评论正文下方的 .comment-replies 内，而不再平铺成新的顶层评论。
   只做一层：回复项本身不再提供「回复」按钮。样式沿用 1px 横线分隔。 */
.detail-dialog #detailComments .comment-replies,
#cmtBody .comment-replies {
  margin: 8px 0 2px; padding-left: 10px;
  border-left-width: 2px; border-left-style: solid; border-left-color: var(--line);
}
.detail-dialog #detailComments .comment-reply-item,
#cmtBody .comment-reply-item {
  padding: 8px 0;
  border-bottom-width: 1px; border-bottom-style: solid; border-bottom-color: var(--line);
}
.detail-dialog #detailComments .comment-reply-item:first-child,
#cmtBody .comment-reply-item:first-child { padding-top: 6px; }
.detail-dialog #detailComments .comment-reply-item:last-child,
#cmtBody .comment-reply-item:last-child { padding-bottom: 2px; border-bottom-width: 0; }
.detail-dialog #detailComments .comment-reply-item .comment-head b,
#cmtBody .comment-reply-item .comment-head b { font-size: 12px; }
.detail-dialog #detailComments .comment-reply-item .comment-text,
#cmtBody .comment-reply-item .comment-text { font-size: 12px; }
.detail-dialog #detailComments .comment-reply-item .comment-attachments,
#cmtBody .comment-reply-item .comment-attachments { margin-top: 5px; }

/* 回复态提示条：详情页在固定底栏输入条内，抽屉在 cmt-foot 内，均在输入框上方 */
.detail-dialog #detailComposerSlot .composer-reply-tip,
.cmt-reply-tip {
  display: flex; align-items: center; gap: 4px;
  margin: 0 0 4px; padding: 3px 8px;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 4px; font-size: 11px; line-height: 1.4;
}
.cmt-reply-tip { margin-bottom: 6px; }
.detail-dialog #detailComposerSlot .composer-reply-tip[hidden],
.cmt-reply-tip[hidden] { display: none; }
.detail-dialog #detailComposerSlot .composer-reply-tip b,
.cmt-reply-tip b { font-weight: 650; }
.detail-dialog #detailComposerSlot .composer-reply-tip button,
.cmt-reply-tip button {
  margin-left: auto; border: 0; background: transparent; color: var(--accent);
  display: grid; place-items: center; width: 18px; height: 18px; min-height: 0; padding: 0;
}
.detail-dialog #detailComposerSlot .composer-reply-tip button svg,
.cmt-reply-tip button svg { width: 12px; height: 12px; }

/* 嵌入主原型的动态 Tab 时，仅保留信息流内容与其内部滚动。 */
html.is-embedded,
body.is-embedded { width: 100%; height: 100%; min-height: 0; overflow: hidden; }
body.is-embedded { background: #f5f7fa; }
body.is-embedded .workbench { width: 100%; height: 100%; min-height: 0; overflow: hidden; }
body.is-embedded .app-nav,
body.is-embedded .app-topbar,
body.is-embedded .bottom-nav { display: none !important; }
body.is-embedded .page-shell { width: 100%; height: 100%; min-height: 0; margin: 0 !important; padding: 0; }
body.is-embedded .page-shell main { height: 100%; min-height: 0; padding: 14px !important; overflow-y: auto; }

/* 安全现场信息流：风险色用于状态与关键动作。 */
body.is-embedded .workbench {
  --canvas: #f1f4f7;
  --surface: #ffffff;
  --surface-soft: #e8eef4;
  --text: #172a3b;
  --muted: #718197;
  --line: #dce5ed;
  --accent: #dd493f;
  --accent-soft: #fff0ee;
  --nav: #133450;
  --nav-hover: #1a4668;
  --shadow: 0 8px 22px rgba(19, 52, 80, .08);
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
body.is-embedded #view-feed .feed-search-mini {
  border: 1px solid rgba(255, 255, 255, .3) !important;
  background: rgba(255, 255, 255, .96) !important;
  box-shadow: 0 5px 14px rgba(7, 26, 44, .16);
}
body.is-embedded #view-feed .feed-search-mini svg { color: #527089; }
body.is-embedded #view-feed .feed-search-mini input { color: #1a3145; }
body.is-embedded #view-feed .feed-post-btn {
  border: 1px solid rgba(255, 255, 255, .18) !important;
  background: #e84e45 !important;
  color: #ffffff !important;
  box-shadow: 0 5px 14px rgba(7, 26, 44, .2);
}
body.is-embedded #view-feed .feed-layout--scoped .feed-scope {
  gap: 18px !important;
  background: rgba(255, 255, 255, .98) !important;
  border-bottom-color: #dfe7ee !important;
  box-shadow: 0 5px 13px rgba(21, 45, 67, .05);
}
body.is-embedded #view-feed .feed-layout--scoped .feed-scope::after {
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .98));
}
body.is-embedded #view-feed .feed-scope-item {
  position: relative;
  color: #718197 !important;
  font-weight: 650 !important;
}
body.is-embedded #view-feed .feed-scope-item.sel {
  color: #183e5d !important;
  font-weight: 750 !important;
}
body.is-embedded #view-feed .feed-scope-item.sel::after {
  position: absolute;
  right: 2px;
  bottom: 5px;
  left: 2px;
  height: 3px;
  border-radius: 3px;
  background: #e44b42;
  content: "";
}
body.is-embedded #view-feed .feed-type-tag {
  border: 1px solid currentColor;
  border-color: color-mix(in srgb, currentColor 24%, transparent);
  font-weight: 700 !important;
  letter-spacing: .01em;
}
body.is-embedded #view-feed .feed-toolbar {
  margin: 8px 0 4px !important;
  padding: 8px 0 4px !important;
}
body.is-embedded .feed-quick-chip,
body.is-embedded .feed-filter-btn {
  border-color: #d9e4ed;

/* 为每条动态补充可排序的时间戳，用于详情页「按时间倒序」与「时间筛选」展示 */
function tsFromLabel(label) {
  if (!label) return null;
  let m;
  if (label === '刚刚') return Date.now();
  if ((m = label.match(/^(\d+)\s*分钟前$/))) return Date.now() - parseInt(m[1], 10) * 60000;
  if ((m = label.match(/^(\d+)\s*小时前$/))) return Date.now() - parseInt(m[1], 10) * 3600000;
  if ((m = label.match(/^(\d+)\s*天前$/))) return Date.now() - parseInt(m[1], 10) * 86400000;
  const now = new Date();
  if ((m = label.match(/^今天\s*(\d{1,2}):(\d{2})$/))) { const d = new Date(now); d.setHours(+m[1], +m[2], 0, 0); return d.getTime(); }
  if ((m = label.match(/^昨天\s*(\d{1,2}):(\d{2})$/))) { const d = new Date(now); d.setDate(d.getDate() - 1); d.setHours(+m[1], +m[2], 0, 0); return d.getTime(); }
  return null;
}

const navSubpanel = document.createElement('div');

document.body.appendChild(navSubpanel);

function toggleNavSub(parentBtn) {
  const nav = NAV.find(n => n.key === parentBtn.dataset.navParent);
  if (!nav || !nav.children) return;
  if (window.innerWidth <= 850) { openModule(nav.children[0].module); return; }
  const open = navSubpanel.classList.contains('open') && navSubpanel.dataset.for === nav.key;
  $$('#navLinks .nav-link').forEach(b => b.classList.remove('expanded'));
  if (open) {
    navSubpanel.classList.remove('open'); navSubpanel.hidden = true;
    document.body.classList.remove('nav-shifted');
  } else {
    navSubpanel.dataset.for = nav.key;
    navSubpanel.innerHTML = `<div class="nsp-head">${esc(nav.label)}</div>` + nav.children.map(c =>
      `<button class="nsp-item" data-nav-module="${c.module}">${c.icon}<span>${esc(c.label)}</span></button>`
    ).join('');
    navSubpanel.classList.add('open'); navSubpanel.hidden = false;
    parentBtn.classList.add('expanded');
    document.body.classList.add('nav-shifted');
  }
}
navSubpanel.addEventListener('click', (e) => {
  const it = e.target.closest('[data-nav-module]');
  if (!it) return;
  openModule(it.dataset.navModule);
  navSubpanel.classList.remove('open'); navSubpanel.hidden = true;
  document.body.classList.remove('nav-shifted');
  $$('#navLinks .nav-link').forEach(b => b.classList.remove('expanded'));
});
document.addEventListener('click', (e) => {
  if (navSubpanel.classList.contains('open') && !navSubpanel.contains(e.target) && !e.target.closest('[data-nav-parent]')) {
    navSubpanel.classList.remove('open'); navSubpanel.hidden = true;
    document.body.classList.remove('nav-shifted');
    $$('#navLinks .nav-link').forEach(b => b.classList.remove('expanded'));
  }
});

/* 可关闭标签页（依据左侧菜单点击的功能模块生成） */
let openTabs = [];
let activeTab = null;
function openModule(id) {
  if (!MODULES[id]) return;
  if (!openTabs.includes(id)) openTabs.push(id);
  activeTab = id;
  renderTabs();
  activateView(id);
}
function closeTab(id) {
  const i = openTabs.indexOf(id);
  if (i < 0) return;
  openTabs.splice(i, 1);
  if (activeTab === id) activeTab = openTabs.length ? openTabs[Math.max(0, i - 1)] : null;
  renderTabs();
  if (activeTab) activateView(activeTab); else showEmptyWorkspace();
}
function renderTabs() {
  $('#wsTabs').innerHTML = openTabs.length
    ? openTabs.map(id => {
        const m = MODULES[id];
        return `<div class="ws-tab ${id === activeTab ? 'active' : ''}" data-ws-tab="${id}"><span>${esc(m.label)}</span><button class="ws-tab-close" data-ws-close="${id}" title="关闭">${I.close}</button></div>`;
      }).join('')
    : '<div class="ws-empty">从左侧菜单选择功能模块开始</div>';
}
function activateView(id) {
  const m = MODULES[id];
  ['view-feed', 'view-module', 'view-empty', 'view-file', 'view-nodetail'].forEach(s => { const el = $('#' + s); if (el) el.hidden = true; });
  if (m.view === 'feed') {
    switchView(m.view);
  } else {
    $('#view-module').hidden = false;
    $('#modTitle').textContent = m.label;
    $('#modIcon').innerHTML = m.icon || I.apps;
  }
}
function showEmptyWorkspace() {
  ['view-feed', 'view-module', 'view-file', 'view-nodetail'].forEach(s => { const el = $('#' + s); if (el) el.hidden = true; });
  const e = $('#view-empty'); if (e) e.hidden = false;
}
$('#wsTabs').addEventListener('click', (e) => {
  const close = e.target.closest('[data-ws-close]');
  if (close) { closeTab(close.dataset.wsClose); return; }
  const tab = e.target.closest('[data-ws-tab]');
  if (tab) openModule(tab.dataset.wsTab);
});

/* ============ Feed list ============ */
const FILTERS = [['all', '全部'], ['form', '表单动态'], ['process', '流程动态'], ['task', '任务动态'], ['warning', '预警动态'], ['manual', '普通动态']];
const TIME_FILTERS = [['all', '不限'], ['today', '今天'], ['7d', '近 7 天'], ['30d', '近 30 天']];
let curFilter = 'all';
let curSearch = '';
let feedScope = 'all';     /* 范围 Tab：all / mine / faved / commented / liked */
let curTime = 'all';       /* 高级筛选：时间范围 all / today / 7d / 30d */
let curNo = 'all';         /* 动态号筛选：all 或 FEEDNOS.id（由抽屉精确检索设置） */
let curAttachOnly = false; /* 高级筛选：只看带附件 */

function inTimeRange(f) {
  if (curTime === 'all' || f.ts == null) return true;
  const now = new Date();
  let from;
  if (curTime === 'today') { const d = new Date(now); d.setHours(0, 0, 0, 0); from = d.getTime(); }
  else from = now.getTime() - (curTime === '7d' ? 7 : 30) * 86400000;
  return f.ts >= from;
}

function filterFeeds(list) {
  return list.filter(f => {
    if (curFilter !== 'all' && f.type !== curFilter) return false;
    if (curNo !== 'all' && f.noId !== curNo) return false;
    if (!inTimeRange(f)) return false;
    if (curAttachOnly && !(f.attachments && f.attachments.length)) return false;
    if (feedScope === 'mine' && f.operator !== ME) return false;
    if (feedScope === 'faved' && !f.faved) return false;
    if (feedScope === 'commented' && !f.comments.some(c => c.author === ME)) return false;
    if (feedScope === 'liked' && !f.likes.some(l => l.name === ME)) return false;
    if (curSearch) {
      const q = curSearch.toLowerCase();
      const hay = (f.title + f.summary + f.operator + (f.related ? f.related.label : '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* 附件：可点击 → 图片查看器 / 文件预览页 */
/* 附件（仅文件）：动态不再展示图片，图片类附件在渲染层直接过滤掉 */
function attachmentsHTML(f, style = '') {
  /* 拍照产生的图片附件同样展示（其余图片仍按原设定不展示），点击可进图片查看器 */
  const list = (f.attachments || []).map((a, i) => ({ a, i })).filter(x => x.a.kind !== 'img' || x.a.fromCamera);
  if (!list.length) return '';
  const items = list.map(({ a, i }) =>
    `<button class="feed-attachment${a.kind === 'img' ? ' is-photo' : ''}" data-att="${f.id}:${i}" title="预览${a.kind === 'img' ? '照片' : '文件'}">${a.kind === 'img' ? I.img : I.doc}${esc(a.name)}<small>预览</small></button>`
  ).join('');
  return `<div class="feed-attachments"${style ? ` style="${style}"` : ''}>${items}</div>`;
}

/* 附件类型推断与图标 */
const IMG_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'];
function attKind(name) {
  const e = (String(name).split('.').pop() || '').toLowerCase();
  return IMG_EXT.includes(e) ? 'img' : 'file';
}
function attIcon(name) { return attKind(name) === 'img' ? I.img : I.doc; }
/* picker 项 / 数据项 → 统一附件对象 { name, kind, url } */
function toAtt(p) { return { name: p.n || p.name, kind: p.kind || attKind(p.n || p.name), url: p.url || '' }; }

/* 评论附件：照片缩略图与普通文件分别展示，均可点击预览。 */
function miniAttachmentsHTML(list, cidx) {
  const rows = (list || []).map((a, i) => ({ a, i }));
  const photos = rows.filter(x => x.a.kind === 'img');
  const files = rows.filter(x => x.a.kind !== 'img');
  if (!rows.length) return '';
  return `${photos.length ? `<div class="comment-photo-grid">${photos.map(({ a, i }) =>
    `<button class="comment-photo" data-catt="${cidx}:${i}" title="预览照片：${esc(a.name)}">${a.url ? `<img src="${esc(a.url)}" alt="${esc(a.name)}">` : I.img}</button>`
  ).join('')}</div>` : ''}${files.length ? `<div class="comment-attachments">${files.map(({ a, i }) =>
    `<button class="cmt-att" data-catt="${cidx}:${i}" title="预览文件">${I.doc}${esc(a.name)}<small>预览</small></button>`
  ).join('')}</div>` : ''}`;
}

}

/* 信息流分批软加载：每批 10 条，滚动到底自动追加；全部加载完显示「暂无更多动态」。
   renderFeed(reset) —— 筛选/搜索变化传 true 重置到第一批；点赞/评论等原地刷新不传参，保留已加载条数。 */
const FEED_PAGE_SIZE = 10;
let feedVisibleCount = FEED_PAGE_SIZE;
let feedFiltered = [];   // 当前筛选结果缓存，追加时复用，避免重复 filter

function updateFeedLoadMore() {
  const el = $('#feedLoadMore');
  if (!el) return;
  if (!feedFiltered.length) { el.hidden = true; el.innerHTML = ''; el.classList.remove('is-end'); return; }
  el.hidden = false;
  if (feedVisibleCount >= feedFiltered.length) {
    el.classList.add('is-end');
    el.innerHTML = '<span class="feed-end-text">暂无更多动态</span>';
  } else {
    el.classList.remove('is-end');
    const rest = feedFiltered.length - feedVisibleCount;
    el.innerHTML = '<button type="button" id="feedLoadMoreBtn" class="feed-load-btn">上滑加载更多<span>还有 ' + rest + ' 条</span></button>';
  }
}

function loadMoreFeeds() {
  if (feedVisibleCount >= feedFiltered.length) return;
  const from = feedVisibleCount;
  feedVisibleCount = Math.min(feedVisibleCount + FEED_PAGE_SIZE, feedFiltered.length);
  const added = feedFiltered.slice(from, feedVisibleCount).map(feedCardHTML).join('');
  if (added) $('#feedList').insertAdjacentHTML('beforeend', added);
  updateFeedLoadMore();
}

function renderFeed(reset) {
  feedFiltered = filterFeeds(feeds);
  if (reset) feedVisibleCount = FEED_PAGE_SIZE;
  const shown = feedFiltered.slice(0, feedVisibleCount);
  $('#feedList').innerHTML = shown.map(feedCardHTML).join('');
  $('#feedEmpty').hidden = feedFiltered.length > 0;
  updateFeedLoadMore();
  renderScopeCounts();
  renderTypeStats();
  syncFilterUI();
}

/* ============ Scope tree counts（与列表使用同一组筛选条件，避免计数对不上） ============ */
function renderScopeCounts() {
  const base = feeds.filter(f => {
    if (curFilter !== 'all' && f.type !== curFilter) return false;
    if (curNo !== 'all' && f.noId !== curNo) return false;
    if (!inTimeRange(f)) return false;
    if (curAttachOnly && !(f.attachments && f.attachments.length)) return false;
    if (curSearch) {
      const q = curSearch.toLowerCase();
      const hay = (f.title + f.summary + f.operator + (f.related ? f.related.label : '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const counts = {
    all: base.length,
    mine: base.filter(f => f.operator === ME).length,
    faved: base.filter(f => f.faved).length,
    commented: base.filter(f => f.comments.some(c => c.author === ME)).length,
    liked: base.filter(f => f.likes.some(l => l.name === ME)).length,
  };
  $$('#feedScopeTree .feed-scope-item').forEach(b => {
    const c = b.querySelector('.feed-scope-count');
    if (c) c.textContent = counts[b.dataset.scope] || 0;
  });
}

/* ============ Type stats ============ */
function renderTypeStats() {
  if (!$('#typeStats')) return;
  const counts = { form: 0, process: 0, task: 0, warning: 0 };
  feeds.forEach(f => counts[f.type]++);
  const max = Math.max(1, ...Object.values(counts));
  $('#typeStats').innerHTML = Object.entries(counts).map(([k, v]) => {
    const t = TYPES[k];
    return `<div class="stat-row">
      <span class="stat-tag" style="color:${t.color};background:${t.soft}">${t.label}</span>
      <span class="stat-bar"><i style="width:${(v / max) * 100}%;background:${t.color}"></i></span>
      <span class="stat-num">${v}</span>
    </div>`;
  }).join('');
}

function activeFilterCount() {
  let n = 0;
  if (curFilter !== 'all') n++;
  if (curNo !== 'all') n++;
  if (curTime !== 'all') n++;

  return n;
}

function activeFilterLabels() {
  const out = [];
  const ft = FILTERS.find(x => x[0] === curFilter);
  if (curFilter !== 'all' && ft) out.push(ft[1]);
  const no = FEEDNOS.find(x => x.id === curNo);
  if (curNo !== 'all') out.push(no ? no.name : '指定动态号');
  const tt = TIME_FILTERS.find(x => x[0] === curTime);
  if (curTime !== 'all' && tt) out.push(tt[1]);
  if (curAttachOnly) out.push('带附件');
  return out;
}

/* 统一同步：chip 选中态 / 筛选按钮角标 / 已筛选条 / 抽屉内状态与结果数 */

function bindComposer(f) {
  const input = $('#composerInput');
  const send = $('#sendBtn');
  const composer = input.closest('.composer');
  const replyTip = $('#composerReplyTip');
  const replyName = $('#composerReplyName');
  const defaultPlaceholder = '发表评论，输入 @ 可提及成员…';
  /* 默认只显示输入框；点击 / 聚焦后在输入框下方展开工具条（横排） */
  const expandComposer = () => { if (composer) composer.classList.add('is-expanded'); };
  /* 回复态：composerReplyTo 记录被回复的顶层评论在 f.comments 中的原始下标 */
  const clearReply = () => {
    composerReplyTo = null;
    if (replyTip) replyTip.hidden = true;
    if (replyName) replyName.textContent = '';
    input.placeholder = defaultPlaceholder;
  };
  const startReply = (idx, author) => {
    composerReplyTo = { idx, author };
    if (replyTip) replyTip.hidden = false;
    if (replyName) replyName.textContent = author;
    input.placeholder = `回复 @${author}…`;
    expandComposer();
  };
  input.addEventListener('focus', expandComposer);
  input.addEventListener('click', expandComposer);
  input.addEventListener('input', () => { send.disabled = !input.value.trim() && !composerPhotos.length; });
  send.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text && !composerPhotos.length) return;
    const entry = { author: '张宇', tone: 'blue', time: '刚刚', content: text, attachments: composerPhotos.map(toAtt) };
    const parent = composerReplyTo && f.comments[composerReplyTo.idx];
    if (parent) {
      /* 楼中楼：回复写进父评论，展示在该条评论下方 */
      if (!parent.replies) parent.replies = [];
      parent.replies.push(entry);
    } else {
      f.comments.push(entry);
    }
    renderDetailComments(f);
    input.value = ''; composerPhotos = []; renderComposerPhotos(); send.disabled = true;
    clearReply();
    /* 发布完回到「只留输入框」的收起态 */
    if (composer) composer.classList.remove('is-expanded');
    input.blur();
    toast(parent ? '回复已发布' : '评论已发布');
    renderFeed();
  });
  $('#emojiBtn').addEventListener('click', (e) => openEmoji(e.currentTarget, input));
  /* @ → 二级页面「提及成员」，确认后回填评论框 */
  $('#atBtn').addEventListener('click', () => openMemberPicker({
    title: '提及成员', sub: '被提及的成员会收到提醒，不会生成新动态',
    selected: [], confirmText: '插入到评论',
    onConfirm(names) {
      input.value = (input.value.trim() + ' ' + names.map(n => '@' + n).join(' ') + ' ').trimStart();
      send.disabled = !input.value.trim();
      closeSheet(); input.focus();
      toast(`已提及 ${names.length} 位成员`);
    },
  }));
  /* 评论照片：调起系统相册，选中后在输入区直接回显缩略图。 */
  $('#picBtn').addEventListener('click', () => pickCommentPhotos((list) => {
    composerPhotos = composerPhotos.concat(list).slice(0, 9);
    renderComposerPhotos();
    send.disabled = !input.value.trim() && !composerPhotos.length;
    toast(`已添加 ${list.length} 张照片`);
  }));
  /* 事件委托：发评论会重写 #detailComments，逐元素绑定会失效 */
  $('#detailComments').addEventListener('click', (e) => {
    const b = e.target.closest('.comment-reply');
    if (!b) return;
    const item = b.closest('.comment-item');
    const idx = item ? Number(item.dataset.cidx) : -1;
    const c = f.comments[idx];
    if (!c) return;
    startReply(idx, c.author);
    input.value = `@${c.author} `;
    input.focus(); send.disabled = false;
  });
  /* 取消回复 → 回到普通评论态（保留已输入内容与附件） */
  if (composer) composer.addEventListener('click', (e) => {
    if (!e.target.closest('[data-cancel-reply]')) return;
    clearReply();
    input.focus();
  });
}

/* 直接调起系统本地文件选择（不渲染中间选择器）：选中后把 File 列表转附件对象并回调 onDone */
function pickLocalFiles(onDone) {
  let inp = document.getElementById('localFileInput');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file'; inp.id = 'localFileInput'; inp.multiple = true; inp.accept = ATT_FILE_ACCEPT;
    inp.style.position = 'fixed'; inp.style.left = '-9999px'; inp.style.top = '-9999px';
    document.body.appendChild(inp);
  }
  const handler = () => {
    inp.removeEventListener('change', handler);
    const raw = Array.from(inp.files || []);
    inp.value = '';
    if (!raw.length) return;
    /* 动态不再支持图片：图片文件直接忽略，避免加了却展示不出来 */
    const files = raw.filter(f => attKind(f.name) !== 'img');
    const skipped = raw.length - files.length;
    if (skipped) toast(`已忽略 ${skipped} 个图片文件：动态暂不支持图片`);
    if (!files.length) return;
    const list = files.map(file => {
      const kind = attKind(file.name);

  /* 记住真正的上级浮层，返回时恢复，而不是一律回信息流 */
  recordReturnDetail = $('#detailLayer').hidden ? null : detailId;
  recordReturnSheets = SHEETS.slice();
  recordReturnLightbox = lbState ? JSON.parse(JSON.stringify(lbState)) : null;
  closeSheet(); closeLightbox(); closeDetail();
  const tone = TONE_MAP[r.tone] || TONE_MAP.blue;
  const st = STATUS_MAP[r.statusTone] || STATUS_MAP.ok;
  $('#recTitle').textContent = r.title;
  $('#recHead').innerHTML = `
    <span class="rec-icon" style="background:${tone[0]};color:${tone[1]}">${I[r.icon] || I.doc}</span>
    <div><h1>${esc(r.title)}</h1><p>${esc(r.sub)}</p></div>
    <span class="rec-status" style="background:${st[0]};color:${st[1]}">${esc(r.status)}</span>`;
  $('#recFields').innerHTML = r.fields.map(([k, v, cls]) =>
    `<div class="rec-field${cls ? ' ' + cls : ''}"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  switchView('record');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============ Actions ============ */
function toggleLike(id) {
  const f = feeds.find(x => x.id === id); if (!f) return;
  if (f.liked) { f.liked = false; f.likes = f.likes.filter(l => l.name !== ME); }
  else { f.liked = true; f.likes.push({ name: ME, time: '刚刚' }); }
  renderFeed();
  if (detailId === id) openDetail(id);
}

/* 收藏：卡片/详情页星标切换，配合左侧筛选树「我收藏的动态」 */
function toggleFav(id) {
  const f = feeds.find(x => x.id === id); if (!f) return;
  f.faved = !f.faved;
  renderFeed();
  if (detailId === id) openDetail(id);
  toast(f.faved ? '已收藏该动态，可在左侧「我收藏的动态」查看' : '已取消收藏');
}

/* ============ Toast ============ */
let toastTimer;
function toast(msg) {
  $('#toastText').textContent = msg;
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 2200);
}

/* ============ View switching ============ */
function switchView(v) {
  curView = v;
  $('#view-feed').hidden = v !== 'feed';
  $('#view-timeline').hidden = v !== 'timeline';
  $('#view-record').hidden = v !== 'record';
  $('#view-post').hidden = v !== 'post';
  $('#view-file').hidden = v !== 'file';
  $('#view-nodetail').hidden = v !== 'nodetail';
  /* 二级整页（发动态 / 文件预览）：清零 main 底部内边距，让页脚贴死手机框底边 */
  const mainEl = $('.page-shell main');
  if (mainEl) mainEl.classList.toggle('post-no-pad', v === 'post' || v === 'file');
}


/* ============ Event delegation：所有按钮 → 对应的下一步页面 ============ */
const HOOKS = ['data-detail', 'data-like',
  'data-relate', 'data-relate-tl', 'data-reply',
  'data-at', 'data-photo', 'data-att', 'data-catt', 'data-sheet-back', 'data-sheet-close',
  'data-fav', 'data-scope', 'data-scope-toggle', 'data-del-cmt', 'data-comments',
  'data-pick', 'data-unpick', 'data-photocell', 'data-photosrc',
  'data-hi',
  'data-compose-at', 'data-compose-photo', 'data-unmention', 'data-uncphoto', 'data-rmphoto',
  'data-nf-at', 'data-nf-photo', 'data-nf-file', 'data-nf-camera', 'data-nf-unmention', 'data-nf-uncphoto', 'data-nf-uncamera',
  'data-lb', 'data-lbthumb', 'data-recact', 'data-open-tl', 'data-post-cancel',
  'data-feedno', 'data-nd-time', 'data-nd-publish', 'data-nd-follow-btn', 'data-nd-collapse',
  'data-filter-open', 'data-filter-clear', 'data-qtype',
  'data-ff-type', 'data-ff-time', 'data-ff-no', 'data-ff-reset', 'data-ff-apply'].map(a => '[' + a + ']').join(',');

document.addEventListener('click', (e) => {
  const t = e.target.closest(HOOKS);
  if (!t) return;
  const d = t.dataset;

  /* ---- 三层筛选：快筛 chip / 筛选按钮 / 抽屉选项 ---- */
  if (d.qtype) { curFilter = d.qtype; renderFeed(true); }
  else if (t.hasAttribute('data-filter-open')) { openFeedFilterSheet(); }
  else if (t.hasAttribute('data-filter-clear')) { resetAdvancedFilters(); toast('已清除筛选条件'); }
  else if (d.ffType) { curFilter = d.ffType; renderFeed(true); }
  else if (d.ffTime) { curTime = d.ffTime; renderFeed(true); }
  else if (d.ffNo) { curNo = curNo === d.ffNo ? 'all' : d.ffNo; renderFeed(true); }
  else if (t.hasAttribute('data-ff-reset')) { resetAdvancedFilters(); toast('已重置筛选条件'); }
  else if (t.hasAttribute('data-ff-apply')) { const n = activeFilterCount(); closeSheet(); toast(n ? `已应用 ${n} 项筛选条件` : '当前为全部动态'); }

  /* ---- 列表 / 筛选 / 详情 ---- */
  else if (d.detail) { openDetail(d.detail); }
  else if (d.feedno) { openNoDetail(d.feedno); }
  else if (d.ndTime) {
    ndTimeFilter = d.ndTime;
    $$('#ndTimeSeg button').forEach(b => b.classList.toggle('sel', (b.dataset.ndTime || 'all') === ndTimeFilter));
    renderNdFeeds();
  }
  else if (t.hasAttribute('data-nd-collapse')) {
    ndBasicCollapsed = !ndBasicCollapsed;
    $('#ndBasic').classList.toggle('nd-basic--collapsed', ndBasicCollapsed);
    t.setAttribute('aria-expanded', String(!ndBasicCollapsed));
  }
  else if (t.hasAttribute('data-nd-follow-btn')) {
    const n = noOf(ndId); if (!n) return;
    n.followed = !n.followed;
    toast(n.followed ? '已关注该动态号' : '已取消关注');
    renderNoDetail();
  }
  else if (d.ndPublish) { openPostFeedPage(d.ndPublish); }
  else if (d.like) { toggleLike(d.like); }
  else if (d.fav) { toggleFav(d.fav); }
  else if (d.scope) { feedScope = d.scope; $$('#feedScopeTree .feed-scope-item').forEach(b => b.classList.toggle('sel', b.dataset.scope === feedScope)); renderFeed(true); }
  else if (d.scopeToggle) { const lay = $('#feedScopeLayout'); if (lay) lay.classList.toggle('collapsed'); }
  else if (d.delCmt) { const p = d.delCmt.split(':'); openDeleteComment(p[0], p[1]); }
  else if (t.hasAttribute('data-post-cancel')) { closePostView(); }

  /* ---- 卡片按钮 → 下一步页面 ---- */
  else if (d.comments) { openCommentDrawer(d.comments); }
  else if (d.at) { openMemberPicker({ title: '提及成员', sub: '选择后进入评论编辑 · @ 不生成新动态', confirmText: '下一步', onConfirm: (names) => openComposePage({ id: d.at, mentions: names }) }); }
  else if (d.photo) { openPhotoPicker({ confirmText: '下一步', onConfirm: (list) => openComposePage({ id: d.photo, photos: list }) }); }
  else if (d.att) { const [fid, idx] = d.att.split(':'); const f = feeds.find(x => x.id === fid); (f && f.attachments[idx] && f.attachments[idx].kind === 'img') ? openLightbox(fid, Number(idx)) : openFilePreview(fid, Number(idx)); }
  /* 评论附件：顶层 key = fid:评论idx:附件idx；楼中楼 key = fid:评论idx:回复idx:附件idx */
  else if (d.catt) {
    const p = d.catt.split(':');
    const f = feeds.find(x => x.id === p[0]);
    const c = f && f.comments[Number(p[1])];
    const owner = p.length >= 4 ? (c && c.replies && c.replies[Number(p[2])]) : c;
    const a = owner && owner.attachments && owner.attachments[Number(p[p.length - 1])];
    openAttachmentPreview(a);
  }
  else if (d.relate) { const f = feeds.find(x => x.id === d.relate); if (f) openRecord(f.related.id); }
  else if (d.relateTl) { openRecord(d.relateTl); }

  /* ---- Sheet 通用 ---- */
  else if (t.hasAttribute('data-sheet-back')) { popSheet(); }
  else if (t.hasAttribute('data-sheet-close')) { if (SHEETS.length > 1) popSheet(); else closeSheet(); }

  /* ---- 成员选择页 ---- */
  else if (d.pick) { pickState.sel.has(d.pick) ? pickState.sel.delete(d.pick) : pickState.sel.add(d.pick); pickRefresh(); }
  else if (d.unpick) { pickState.sel.delete(d.unpick); pickRefresh(); }

  /* ---- 照片选择页 ---- */
  else if (d.photocell) {
    const i = Number(d.photocell);
    if (photoState.sel.has(i)) photoState.sel.delete(i);
    else if (photoState.sel.size >= 9) toast('最多选择 9 个附件');
    else photoState.sel.add(i);
    photoRefresh();
  }
  else if (d.photosrc) {
    if (d.photosrc === 'files') { const inp = document.getElementById('attFileInput'); if (inp) inp.click(); }
    else if (d.photosrc === 'camera') { photoState.extra.unshift({ n: `拍摄_${String(Date.now()).slice(-4)}.jpg`, d: '刚刚 · 拍照', kind: 'img' }); photoState.sel = new Set([...photoState.sel].map(i => i + 1)); photoState.sel.add(0); photoRefresh(); toast('已拍摄 1 张照片'); }
    else if (d.photosrc === 'album') { toast('已打开本地相册选择器'); }
    else { photoState.extra.unshift({ n: '单据附件_现场照片.jpg', d: '来自关联单据附件', kind: 'img' }); photoState.sel = new Set([...photoState.sel].map(i => i + 1)); photoState.sel.add(0); photoRefresh(); toast('已从单据附件添加 1 张'); }
  }


  /* ---- 评论编辑页 ---- */
  else if (t.hasAttribute('data-compose-at')) {
    const cid = composeState.id;
    openMemberPicker({
      title: '添加提及成员', selected: composeState.mentions, groups: false, confirmText: '确定',
      onConfirm(list) {
        const added = list.filter(n => !composeState.mentions.includes(n));
        composeState.mentions = list;
        composeState.text = (composeState.text.trim() + ' ' + added.map(n => '@' + n).join(' ') + ' ').trimStart();
        popSheet(); composeRefresh(); if (cid) void cid;
      },
    });
  }
  else if (t.hasAttribute('data-compose-photo')) {
    /* 动态不带图片：附件只从本地文件选择（文档类） */
    pickLocalFiles((list) => { composeState.photos = composeState.photos.concat(list); composeRefresh(); toast(`已添加 ${list.length} 个附件`); });
  }
  else if (d.unmention) { composeState.mentions = composeState.mentions.filter(m => m !== d.unmention); composeState.text = composeState.text.replace('@' + d.unmention, '').replace(/\s+/g, ' ').trim(); composeRefresh(); }
  else if (d.uncphoto) { composeState.photos.splice(Number(d.uncphoto), 1); composeRefresh(); }
  else if (d.rmphoto) { composerPhotos.splice(Number(d.rmphoto), 1); renderComposerPhotos(); const s = $('#sendBtn'); if (s) s.disabled = !$('#composerInput').value.trim() && !composerPhotos.length; }

  /* ---- 发起动态编辑页 ---- */
  else if (t.hasAttribute('data-nf-at')) {
    openMemberPicker({
      title: '添加提及成员', selected: feedDraft.mentions, groups: false, confirmText: '确定',
      onConfirm(list) { feedDraft.mentions = list; popSheet(); newFeedRefresh(); },
    });
  }
  else if (t.hasAttribute('data-nf-photo')) {
    /* 动态不带图片：附件只从本地文件选择（文档类） */
    pickLocalFiles((list) => { feedDraft.photos = feedDraft.photos.concat(list); newFeedRefresh(); toast(`已添加 ${list.length} 个附件`); });
  }
  /* 发动态：附件直接弹出电脑原生文件选择弹窗 */
  else if (t.hasAttribute('data-nf-file')) {
    hideMockKeyboard();
    const inp = document.createElement('input');
    inp.type = 'file'; inp.multiple = true; inp.style.display = 'none';
    inp.addEventListener('change', () => {
      const files = Array.prototype.slice.call(inp.files || []);
      if (files.length) {
        feedDraft.photos = feedDraft.photos.concat(files.map(f => ({ n: f.name, kind: attKind(f.name), url: '' })));
        newFeedRefresh();
      }
      inp.remove();
    });
    document.body.appendChild(inp);
    inp.click();
  }
  /* 发动态：现场照片独立于普通附件，并沿用任务执行页的九宫格留痕方式。 */
  else if (t.hasAttribute('data-nf-camera')) {
    hideMockKeyboard();
    const remaining = 9 - feedDraft.cameraPhotos.length;
    if (remaining <= 0) { toast('最多上传 9 张现场照片'); return; }
    pickCameraPhoto((list) => {
      const photos = list.slice(0, remaining);
      feedDraft.cameraPhotos = feedDraft.cameraPhotos.concat(photos);
      newFeedRefresh();
      toast(`已拍摄 ${photos.length} 张现场照片`);
    });
  }
  else if (d.nfUnmention) { feedDraft.mentions = feedDraft.mentions.filter(m => m !== d.nfUnmention); newFeedRefresh(); }
  else if (d.nfUncphoto) { feedDraft.photos.splice(Number(d.nfUncphoto), 1); newFeedRefresh(); }
  else if (d.nfUncamera) { feedDraft.cameraPhotos.splice(Number(d.nfUncamera), 1); newFeedRefresh(); }

  else if (d.hi) { toast(`已向 ${d.hi} 发送打招呼`); }


  /* ---- 图片查看器 ---- */
  else if (d.lb) {
    if (d.lb === 'close') closeLightbox();
    else if (d.lb === 'prev') { lbState.pos = Math.max(0, lbState.pos - 1); renderLightbox(); }
    else if (d.lb === 'next') { lbState.pos = Math.min(lbState.imgs.length - 1, lbState.pos + 1); renderLightbox(); }
    else if (d.lb === 'download') { toast(`正在下载 ${lbState.imgs[lbState.pos].name}`); }
    else if (d.lb === 'record') { const f = lbState.fid ? feeds.find(x => x.id === lbState.fid) : null; if (!f || !f.related) { toast('该附件无关联单据'); return; } openRecord(f.related.id); }
  }
  else if (d.lbthumb) { lbState.pos = Number(d.lbthumb); renderLightbox(); }

  /* ---- 关联单据详情页 ---- */
  else if (d.recact) { toast(`已执行：${d.recact}`); }
  else if (t.hasAttribute('data-open-tl')) { switchView('timeline'); window.scrollTo({ top: 0, behavior: 'smooth' }); }

});

/* Theme toggle */
$('#themeToggle').addEventListener('click', () => {

  wb.classList.toggle('theme-dark'); wb.classList.toggle('theme-light');
});


/* ============ 信息流分批软加载：滚动到底自动加载下一批 ============ */
(function bindFeedInfiniteScroll() {
  const main = document.querySelector('.page-shell main');
  if (!main) return;
  main.addEventListener('scroll', () => {
    if (curView !== 'feed') return;
    if (feedVisibleCount >= feedFiltered.length) return;
    /* 距底部 120px 提前触发，滑动更顺滑；追加后 scrollHeight 变大，不会连续触发 */
    if (main.scrollTop + main.clientHeight < main.scrollHeight - 120) return;
    loadMoreFeeds();
  }, { passive: true });
  /* 提示条按钮：桌面预览 / 内容不足一屏时也可手动加载 */
  document.addEventListener('click', (e) => {
    if (e.target && e.target.closest('#feedLoadMoreBtn')) loadMoreFeeds();
  });
})();

renderQuickFilters();
renderFeed();
renderTimeline();

<script>
/* 移动端桥接：底部导航 -> 既有 openModule；切换视图时同步高亮与隐藏 */
(function () {
  var wb = document.getElementById('workbench');
  var scrollHost = document.querySelector('.page-shell main');
  var lastParentScrollState = null;

  function notifyHost(type, payload) {
    if (window.parent === window) return;
    window.parent.postMessage(Object.assign({ type: type }, payload || {}), '*');
  }

  function syncParentScroll() {
    if (!scrollHost) return;
    var isScrolled = curView === 'feed' && scrollHost.scrollTop > 8;
    wb.classList.toggle('is-feed-scrolled', isScrolled);
    if (isScrolled === lastParentScrollState) return;
    lastParentScrollState = isScrolled;
    notifyHost('activity-scroll-state', { isScrolled: isScrolled });
  }

  function recomputeDetail() {
    var isSub = curView !== 'feed';
    var detailOpen = !document.getElementById('detailLayer').hidden;
    var isDetail = isSub || detailOpen;
    wb.classList.toggle('is-detail', isDetail);
    notifyHost('activity-detail-state', { isDetail: isDetail });
    if (isDetail) notifyHost('activity-scroll-state', { isScrolled: false });
  }
  var navItems = document.querySelectorAll('#bottomNav .nav-item');
  for (var i = 0; i < navItems.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        var m = b.getAttribute('data-bottom-module');
        if (m) openModule(m);
      });
    })(navItems[i]);
  }
  /* 视图切换时同步底部导航高亮 / 隐藏 */
  var _switchView = switchView;
  switchView = function (v) { _switchView(v); recomputeDetail(); };
  var _activateView = activateView;
  activateView = function (id) { _activateView(id); recomputeDetail(); };
  /* 动态详情作为下一级页面：打开/关闭时同步底部导航隐藏与返回 */
  var _openDetail = openDetail;
  openDetail = function (id) { _openDetail(id); recomputeDetail(); };
  var _closeDetail = closeDetail;
  closeDetail = function () { _closeDetail(); recomputeDetail(); };
  if (scrollHost) scrollHost.addEventListener('scroll', syncParentScroll, { passive: true });
  recomputeDetail();
  syncParentScroll();
})();
</script>

<script>
/* ============================================================
   键盘避让：输入框获得焦点 / 键盘弹出时，页面向上推，输入框不被遮挡
   · 弹层类容器（详情页、底部抽屉、二级页）用 --kb-h 整体抬高
   · 普通页面内的输入框把焦点元素滚到可视区中部
   ============================================================ */
(function keyboardAvoid() {
  var root = document.body;
  var activeField = null;

  function isField(el) {
    if (!el) return false;
    if (el.tagName === 'TEXTAREA' || el.isContentEditable) return true;
    if (el.tagName !== 'INPUT') return false;
    /* 复选框/单选/按钮等不弹系统键盘，不能触发模拟键盘或键盘避让 */
    var t = String(el.type || 'text').toLowerCase();
    return ['text', 'search', 'url', 'tel', 'email', 'password', 'number'].indexOf(t) >= 0;
  }
  function kbHeight() {
    var vv = window.visualViewport;
    if (!vv) return 0;
    return Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  }
  function syncKbVar() {
    /* 模拟键盘显示时由它维护 --kb-h / kb-open，真机键盘逻辑不覆盖 */
    if (root.classList.contains('mock-kb-open')) return;
    var h = kbHeight();
    root.style.setProperty('--kb-h', h + 'px');
    root.classList.toggle('kb-open', h > 80);
  }
  /* 最近的纵向可滚动祖先 */
  function scrollParent(el) {
    var p = el.parentElement;
    while (p && p !== root) {
      var s = getComputedStyle(p);
      if (/(auto|scroll)/.test(s.overflowY) && p.scrollHeight > p.clientHeight + 4) return p;
      p = p.parentElement;
    }
    return null;
  }
  /* 把元素推到可视区中部偏上，给键盘留位置 */
  function reveal(el) {
    if (!isField(el) || !el.isConnected) return;
    var vv = window.visualViewport;
    var visTop = vv ? vv.offsetTop : 0;
    var kbCut = root.classList.contains('mock-kb-open') ? (parseInt(root.style.getPropertyValue('--kb-h'), 10) || 0) : 0;
    var visBottom = visTop + (vv ? vv.height : window.innerHeight) - kbCut;
    var r = el.getBoundingClientRect();
    var over = r.bottom + 24 - visBottom;
    var under = visTop + 8 - r.top;
    if (over <= 0 && under <= 0) return;
    /* 先让最近的滚动容器把元素带到中间 */
    try { el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
    /* 容器已到顶/到底仍被遮住时，再整体补一段位移 */
    setTimeout(function () {
      var r2 = el.getBoundingClientRect();
      var d2 = (visTop + 8) - r2.top;
      if (d2 <= 0) return;
      var sc = scrollParent(el);
      if (sc) sc.scrollTop -= d2; else window.scrollBy(0, -d2);
    }, 380);
  }

  document.addEventListener('focusin', function (e) {
    if (!isField(e.target)) return;
    activeField = e.target;
    syncKbVar();
    setTimeout(function () { syncKbVar(); reveal(activeField); }, 240);
    setTimeout(function () { syncKbVar(); reveal(activeField); }, 520);
  });
  document.addEventListener('focusout', function () {
    activeField = null;
    /* 收起键盘后复位 */
    setTimeout(function () {
      if (activeField) return;
      if (root.classList.contains('mock-kb-open')) return;
      syncKbVar();
      if (kbHeight() <= 80) { root.style.setProperty('--kb-h', '0px'); root.classList.remove('kb-open'); }
    }, 60);
  });

  if (window.visualViewport) {
    var t = null;
    window.visualViewport.addEventListener('resize', function () {
      syncKbVar();
      clearTimeout(t);
      t = setTimeout(function () { if (activeField) reveal(activeField); }, 120);
    });
    window.visualViewport.addEventListener('scroll', function () {
      clearTimeout(t);
      t = setTimeout(function () { if (activeField) reveal(activeField); }, 120);
    });
  }
})();
</script>
<script>
/* ============================================================
   模拟键盘：演示环境下点击输入框从底部弹出，可实际输入文字；
   真机检测到系统键盘弹出时自动让位，避免双键盘叠加。
   ============================================================ */
(function mockKeyboard() {
  var kb = document.getElementById('mockKeyboard');
  if (!kb) return;
  var rowsBox = document.getElementById('mkRows');
  var candBox = document.getElementById('mkCandidates');
  var langBtn = document.getElementById('mkLang');
  var numBtn = document.getElementById('mkNum');
  var hint = document.getElementById('mkHint');
  var active = null, zh = false, num = false;
  var KB_H = 240;
  var LETTERS = [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['z','x','c','v','b','n','m'],
  ];
  var NUMS = [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['-','/',':',';','(',')','¥','&','@','!'],
    ['。',',','?','·','…','_','=','+','*','#'],
  ];
  var HANZI = ['的','一','是','我','不','人','在','他','有','这','中','大','为','上','个','国','要','以','说','时'];

  function isField(el) {
    if (!el) return false;
    if (el.tagName === 'TEXTAREA' || el.isContentEditable) return true;
    if (el.tagName !== 'INPUT') return false;
    /* 复选框/单选/按钮等不弹系统键盘，不能触发模拟键盘或键盘避让 */
    var t = String(el.type || 'text').toLowerCase();
    return ['text', 'search', 'url', 'tel', 'email', 'password', 'number'].indexOf(t) >= 0;
  }
  function realKeyboardOpen() {
    var vv = window.visualViewport;
    if (!vv) return false;
    return (window.innerHeight - vv.height - vv.offsetTop) > 80;
  }
  function setCaret(el, pos) { try { el.setSelectionRange(pos, pos); } catch (e) {} }
  function insert(ch) {
    if (!isField(active)) return;
    var v = active.value || '';
    var s = active.selectionStart == null ? v.length : active.selectionStart;
    var e = active.selectionEnd == null ? s : active.selectionEnd;
    active.value = v.slice(0, s) + ch + v.slice(e);
    setCaret(active, s + ch.length);
    active.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function backspace() {
    if (!isField(active)) return;
    var v = active.value || '';
    var s = active.selectionStart == null ? v.length : active.selectionStart;
    var e = active.selectionEnd == null ? s : active.selectionEnd;
    if (s === e && s > 0) s--;
    active.value = v.slice(0, s) + v.slice(e);
    setCaret(active, s);
    active.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function renderRows() {
    var data = num ? NUMS : LETTERS;
    rowsBox.innerHTML = data.map(function (row) {
      return '<div class="mk-row">' + row.map(function (ch) {
        var label = (!num && zh) ? ch.toUpperCase() : ch;
        return '<button type="button" class="mk-key" data-mk-key="' + ch.replace(/"/g, '&quot;') + '">' + label + '</button>';
      }).join('') + '</div>';
    }).join('');
    if (numBtn) numBtn.textContent = num ? 'ABC' : '123';
    if (candBox) {
      candBox.hidden = !zh;
      if (zh) candBox.innerHTML = HANZI.map(function (h) {
        return '<button type="button" data-mk-hanzi="' + h + '">' + h + '</button>';
      }).join('');
    }
    if (langBtn) langBtn.textContent = zh ? '英' : '中';
    var enter = document.getElementById('mkEnter');
    if (enter) enter.textContent = (active && active.tagName === 'TEXTAREA') ? '换行' : '完成';
  }
  function show(el) {
    if (realKeyboardOpen()) return;
    active = el;
    kb.hidden = false;
    document.body.style.setProperty('--kb-h', KB_H + 'px');
    document.body.classList.add('kb-open', 'mock-kb-open');
    if (hint) hint.textContent = el.id === 'nfText' ? '正在输入动态内容' : '正在输入';
    renderRows();
  }
  function hide(keepFocus) {
    if (kb.hidden && !document.body.classList.contains('mock-kb-open')) return;
    kb.hidden = true;
    var el = active;
    active = null;
    document.body.style.setProperty('--kb-h', '0px');
    document.body.classList.remove('kb-open', 'mock-kb-open');
    /* 主动失焦：否则再点同一输入框不会触发 focusin，键盘弹不出来。
       真机系统键盘弹出而让位时保留焦点（keepFocus），避免把系统键盘一起收掉。 */
    if (!keepFocus && el && document.activeElement === el) { try { el.blur(); } catch (e) {} }
  }
  window.hideMockKeyboard = hide; /* 调起文件/相机选择器前收起 */

  document.addEventListener('focusin', function (e) { if (isField(e.target)) show(e.target); });
  document.addEventListener('mousedown', function (e) {
    if (kb.hidden) return;
    if (!kb.contains(e.target) && !isField(e.target)) hide();
  });
  /* mousedown 阻止默认行为，避免点按键时输入框失焦导致键盘收起 */
  kb.addEventListener('mousedown', function (e) {
    e.preventDefault();
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.id === 'mkClose') { hide(); return; }
    if (t.id === 'mkBack') { backspace(); return; }
    if (t.id === 'mkEnter') {
      if (active && active.tagName === 'TEXTAREA') insert('\n');
      else hide();
      return;
    }
    if (t.id === 'mkLang') { zh = !zh; renderRows(); return; }
    if (t.id === 'mkNum') { num = !num; renderRows(); return; }
    if (t.dataset.mkHanzi != null) { insert(t.dataset.mkHanzi); return; }
    if (t.dataset.mkKey != null) { insert(t.dataset.mkKey); }
  });
  /* 真机系统键盘弹出时撤掉模拟键盘 */
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { if (realKeyboardOpen() && !kb.hidden) hide(true); });
  }
})();
</script>
